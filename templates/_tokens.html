{# Shared design tokens — included inside the <style> block of every template.
   Single source of truth for the portal's color/type/spacing/radius/shadow system. #}
:root {
    /* Neutrals */
    --color-bg:            #f1f5f9;
    --color-surface:       #ffffff;
    --color-surface-alt:   #fafbfc;
    --color-border:        #e2e8f0;
    --color-text:          #1f3254;
    --color-text-muted:    #64748b;

    /* Brand / nav chrome (flat navy, no gradients) */
    --color-nav-bg:        #1e3a5f;
    --color-nav-bg-alt:    #2c5282;
    --color-nav-text:      #ffffff;
    --color-accent:        #2c5282;
    --color-accent-hover:  #1e3a5f;

    /* Status colors — bg (tint) + fg (saturated), reused identically for
       badges, flat gantt-bar fills, and heatmap cells across every file */
    --status-completed-bg: #d4edda;  --status-completed-fg: #155724;
    --status-inprocess-bg: #d1ecf1;  --status-inprocess-fg: #0c5460;
    --status-planned-bg:   #fff3cd;  --status-planned-fg:   #e65100;
    --status-onhold-bg:    #e1bee7;  --status-onhold-fg:    #4a148c;
    --status-review-bg:    #bbdefb;  --status-review-fg:    #0d47a1;
    --status-cancelled-bg: #cfd8dc;  --status-cancelled-fg: #37474f;

    /* True-red overrides — never share a hue with the 6 status colors */
    --color-critical:        #ff1744;
    --color-critical-border: #b71c1c;
    --color-overdue:         #d32f2f;
    --color-overdue-dark:    #b71c1c;

    /* Special markers */
    --color-milestone-border: #ffd700;
    --color-milestone-fill:   #ff9800;
    --color-tailed-out:       #9e9e9e;
    --color-gate-passed:      #2e7d32;
    --color-gate-rework:      #e65100;

    /* Dependency-highlight outlines */
    --color-dep-self:             #212121;
    --color-dep-predecessor:      #1565c0;
    --color-dep-predecessor-done: #2e7d32;
    --color-dep-successor:        #e65100;

    /* Row highlights */
    --row-subtask-bg:              #fafbfc;
    --row-rework-bg:               #fff8e1;  --row-rework-border: #ffc107;
    --row-gate-passed-bg:          #e8f5e9;  --row-gate-passed-border: #4caf50;
    --row-gate-passed-rework-bg:   #fff3cd;  --row-gate-passed-rework-border: #ff9800;

    /* Functional, non-decorative — do not fold into status/neutral tokens */
    --subtask-caret-color:  #c5d6c6;
    --subtask-indent-color: #1b3d1c;

    /* Type / spacing / radius / shadow */
    --font-family-base: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    --font-size-sm: 0.8125rem; --font-size-base: 0.9375rem;
    --font-size-md: 1.0625rem; --font-size-lg: 1.25rem; --font-size-xl: 1.75rem;
    --space-1: 4px; --space-2: 8px; --space-3: 12px;
    --space-4: 16px; --space-5: 24px; --space-6: 32px;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .08);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, .12);
}
