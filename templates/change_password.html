{% extends "_auth_base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
    <h1>Set a new password</h1>
    <p class="subtitle">For security, please choose your own password before continuing.</p>
    <form method="post" action="{{ url_for('change_password') }}">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" autofocus required>
        <label for="password_confirm">Confirm new password</label>
        <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" required>
        <button type="submit" class="primary">Save and continue</button>
    </form>
{% endblock %}
