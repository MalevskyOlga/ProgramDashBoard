<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Overall Programs Dashboard{% endblock %}</title>
    <style>
        {% include "_tokens.html" %}
        * { box-sizing: border-box; }
        body {
            font-family: var(--font-family-base);
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: var(--color-nav-bg);
            color: var(--color-text);
        }
        .auth-card {
            background: var(--color-surface); width: 100%; max-width: 400px;
            border-radius: var(--radius-lg); box-shadow: 0 10px 40px rgba(0,0,0,.25);
            padding: 36px 32px;
        }
        .auth-card h1 { font-size: 20px; margin: 0 0 4px; }
        .auth-card .subtitle { color: var(--color-text-muted); font-size: 13px; margin: 0 0 24px; }
        label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
        input[type=text], input[type=password], input[type=email] {
            width: 100%; padding: 10px 12px; border: 1px solid #cbd5e0;
            border-radius: var(--radius-sm); font-size: 14px;
        }
        input:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(44,82,130,.15); }
        button.primary {
            width: 100%; margin-top: 22px; padding: 11px; border: none; cursor: pointer;
            background: var(--color-accent); color: #fff; font-size: 15px; font-weight: 600;
            border-radius: var(--radius-sm);
        }
        button.primary:hover { background: var(--color-accent-hover); }
        .links { margin-top: 18px; font-size: 13px; text-align: center; }
        .links a { color: var(--color-accent); text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .flash { padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 14px; }
        .flash.error { background: #fed7d7; color: #822727; }
        .flash.success { background: #c6f6d5; color: #22543d; }
        .flash.info { background: #bee3f8; color: #2a4365; }
        .note { font-size: 12px; color: var(--color-text-muted); margin-top: 14px; }
        .logo { font-size: 28px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo">📊</div>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
